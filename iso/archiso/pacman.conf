#
# /etc/pacman.conf for the Pitchstone live ISO build
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
Color
ILoveCandy
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# BlackArch is intentionally not enabled in the live ISO by default.
# Users can enable it after install or via the live session script.
