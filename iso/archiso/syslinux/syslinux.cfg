SERIAL 0 115200
UI menu.c32
MENU TITLE Pitchstone OS
MENU CLEAR

DEFAULT arch
TIMEOUT 30

LABEL arch
MENU LABEL Pitchstone OS (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL arch64
MENU LABEL Pitchstone OS (x86_64, BIOS, fallback)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%
